# TripPilot Backend Configuration
server.port=8080

# MongoDB Atlas — read MONGODB_URI from .env or the process environment
# Example: mongodb+srv://<user>:<password>@cluster.mongodb.net/trippilot?retryWrites=true&w=majority
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=trippilot
spring.data.mongodb.auto-index-creation=true

# CORS — allow frontend dev server
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# JSON
spring.jackson.default-property-inclusion=non_null
